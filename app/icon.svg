<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!--
    Favicon : le monogramme M+R du logo, sur pastille noire.

    Fond plein plutôt que transparent : un tracé noir sur fond transparent
    disparaît dans les onglets en thème sombre. Le trait est épaissi par
    rapport au logo de la barre de navigation — à 16 px, un filet de 1,3
    s'efface au rendu.

    Next sert automatiquement ce fichier en favicon via `app/icon.svg`.
  -->
